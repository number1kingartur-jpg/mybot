<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="format-detection" content="telephone=no" />
    <title>KINGMODE — расчёты, тренировки, питание</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

  <body>
    <div class="shell">
      <header class="appbar">
        <div class="appbar__mark">KM</div>
        <div class="appbar__titles">
          <span class="appbar__eyebrow">KINGMODE</span>
          <span class="appbar__title" id="screenTitle">Сегодня</span>
        </div>
      </header>

      <main id="view"></main>

      <footer class="foot">
        <a href="https://arturkingfitness.com" data-ext="site" target="_blank" rel="noopener">Сайт</a>
        <a href="https://t.me/kingmode_fit" data-ext="tg" target="_blank" rel="noopener">Канал</a>
        <p class="foot__copy">
          Расчёты — ориентир, а не медицинская рекомендация. Решение по нагрузке — за тобой.
        </p>
        <!-- Версия сборки: по скриншоту сразу видно, старый код на устройстве или новый -->
        <p class="foot__copy" id="buildMark"></p>
      </footer>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

    <!--
      Поле выбора файла живёт вне #view: экран перерисовывается целиком, и если
      input стоит внутри карточки, он исчезает вместе с ней — в момент, когда
      системный выбор фото ещё открыт. Атрибута capture нет намеренно: с ним
      Android уходит сразу в камеру и теряет галерею.
    -->
    <input
      id="photoInput"
      type="file"
      accept="image/*"
      style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
    />

    <script src="js/api.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/plans.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
