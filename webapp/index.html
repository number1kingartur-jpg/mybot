<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="format-detection" content="telephone=no" />
    <title>KINGMODE: расчёты, тренировки, питание</title>

    <!-- PWA: своя иконка на главном экране и открытие на весь экран без Telegram вокруг -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KINGMODE" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

  <body>
    <div class="shell">
      <header class="appbar">
        <!--
          Корона вместо монограммы «KM»: две буквы ничего не говорили, а название
          рядом в шапке и так написано словом. Рисунок вставлен разметкой, а не
          картинкой и не эмодзи: цвет наследуется от золота темы, размер не зависит
          от шрифта, и лишнего запроса к серверу нет.
        -->
        <div class="appbar__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 18 6 7.5l3.75 4.5L12 5.5l2.25 6.5L18 7.5 19.5 18z" />
            <path d="M6.4 15h11.2" />
          </svg>
        </div>
        <div class="appbar__titles">
          <span class="appbar__eyebrow">KINGMODE</span>
          <span class="appbar__title" id="screenTitle">Сегодня</span>
        </div>
      </header>

      <main id="view"></main>

      <footer class="foot">
        <a href="https://arturkingfitness.com" data-ext="site" target="_blank" rel="noopener">Сайт</a>
        <a href="https://t.me/kingmode_fit" data-ext="tg" target="_blank" rel="noopener">Канал</a>
        <a href="/legal/privacy.html" data-ext="privacy" target="_blank" rel="noopener">Конфиденциальность</a>
        <p class="foot__copy">
          Расчёты дают ориентир, а не медицинскую рекомендацию. Решение по нагрузке за тобой.
        </p>
        <!-- Версия сборки: по скриншоту сразу видно, старый код на устройстве или новый -->
        <p class="foot__copy" id="buildMark"></p>
      </footer>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

    <!--
      Поле выбора файла живёт вне #view: экран перерисовывается целиком, и если
      input стоит внутри карточки, он исчезает вместе с ней — в момент, когда
      системный выбор фото ещё открыт. Атрибута capture нет намеренно: с ним
      Android уходит сразу в камеру и теряет галерею.
    -->
    <input id="photoInput" class="file-ghost" type="file" accept="image/*" />
    <input id="pp-file-front" class="file-ghost" type="file" accept="image/*" data-pp-angle="front" />
    <input id="pp-file-side" class="file-ghost" type="file" accept="image/*" data-pp-angle="side" />
    <input id="pp-file-back" class="file-ghost" type="file" accept="image/*" data-pp-angle="back" />

    <script src="js/api.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/plans.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Регистрация не критична: без неё приложение работает как обычно
      // внутри Telegram, просто «Добавить на главный экран» из браузера
      // не предложит установку как отдельное приложение.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
